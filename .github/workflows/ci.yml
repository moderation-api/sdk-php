# Maintained in moderation-api/sdk-generator (custom/php). Edits here are overwritten.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - run: composer install --no-interaction --no-progress
      - name: Static analysis
        run: |
          set -o pipefail
          if ! vendor/bin/phpstan analyse --level=5 --memory-limit=2g --no-progress --error-format=raw > phpstan.txt 2>&1; then
            head -n 40 phpstan.txt | sed 's/^/::error title=phpstan::/'
            exit 1
          fi
      - name: Load the package
        run: |
          php -r 'require "vendor/autoload.php"; foreach (["ModerationApi\\ModerationApi", "ModerationApi\\WebhookSignature"] as $c) { if (!class_exists($c)) { fwrite(STDERR, "missing $c\n"); exit(1); } }'
