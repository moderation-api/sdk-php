# Maintained in moderation-api/sdk-generator (custom/php). Edits here are overwritten.
# Every push to main whose package version has no release tag yet publishes
# that version and creates the GitHub release (notes: the CHANGELOG.md entry).
# Packagist reads the version from the tag, so the release comes first.
name: Publish Packagist
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Read the version
        run: |
          echo "VERSION=$(sed -n 's/^  version: //p' .speakeasy/gen.yaml | head -n 1)" >> "$GITHUB_ENV"
      - name: Check for an unreleased version
        id: version
        run: |
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already released."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes: the CHANGELOG.md entry of this version, then the release notes file,
          # then the merged pull requests.
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$VERSION" 'index($0, "## " v " (") == 1 {f = 1; next} f && /^## / {exit} f' CHANGELOG.md > "$notes" || true
          if [ ! -s "$notes" ] && [ -f ".github/release-notes/v${VERSION}.md" ]; then
            cp ".github/release-notes/v${VERSION}.md" "$notes"
          fi
          if [ -s "$notes" ]; then
            gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --notes-file "$notes"
          else
            gh release create "v${VERSION}" --target "$GITHUB_SHA" --title "v${VERSION}" --generate-notes
          fi
      - name: Tell Packagist to update
        if: steps.version.outputs.release == 'true'
        run: |-
          curl --fail-with-body -X POST -H 'Content-Type: application/json' "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_SAFE_KEY}" -d '{"repository":"https://github.com/moderation-api/sdk-php"}'
        env:
          PACKAGIST_USERNAME: ${{ secrets.MODERATION_API_PACKAGIST_USERNAME || secrets.PACKAGIST_USERNAME }}
          PACKAGIST_SAFE_KEY: ${{ secrets.MODERATION_API_PACKAGIST_SAFE_KEY || secrets.PACKAGIST_SAFE_KEY }}
